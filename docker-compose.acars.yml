services:
  acars-collector:
    image: grafana/alloy:v1.21.0
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./acars.alloy:/etc/alloy/config.alloy:ro
      - ./data/acars:/logs:ro
      - acars-alloy-data:/var/lib/alloy/data
    restart: unless-stopped

volumes:
  acars-alloy-data:
